<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رزرو برنامه</title>
    <link rel="stylesheet" href="../fonts/font.css" />
    <link rel="stylesheet" href="../root.css" />
    <link rel="stylesheet" href="../resrvno/style.css" />
</head>
<body>

<div class="screen" id="app">
    <div class="nav-bar">
        <button class="nav-btn" type="button" id="navPrev">بازگشت</button>
        <span class="nav-title" id="navTitle">رزرو برنامه</span>
        <button class="nav-btn" type="button" id="navNext">بعدی</button>
    </div>
    <div class="profile-row" id="profileRow">
        <div class="profile-avatar sk sk-avatar" id="profileAvatar"></div>
        <div class="profile-info">
            <div class="profile-top">
                <h1 class="sk sk-line" id="profileName"></h1>
                <span class="sk sk-line" id="profileTag"></span>
            </div>
            <p class="profile-code sk sk-line" id="profileCode"></p>
        </div>
        <button class="profile-action" type="button" id="galleryBtn">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
    </div>
    <form id="bookingForm" onsubmit="return false;" enctype="multipart/form-data">
        <div class="form-section" id="sectionBookingTypes"></div>
        <div class="form-section" id="sectionExtras"></div>
        <div class="form-section" id="sectionTime"></div>
        <div class="form-section" id="sectionLocation"></div>
        <div class="form-section" id="sectionPersonal"></div>
        <div class="form-section" id="sectionNotes"></div>
        <div class="form-section" id="sectionTotal"></div>
        <button class="primary-button" id="bookBtn" type="button">تأیید و رزرو</button>
    </form>
    <p class="footnote" id="footnote"></p>
</div>
<div class="banner" id="banner">
    <span class="check" id="bannerIcon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
    <span id="bannerText"></span>
</div>

<script src="../resrvno/app.js" type="module"></script>
</body>
</html>
