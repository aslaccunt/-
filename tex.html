<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>پیام کانال</title>
<link rel="stylesheet" href="./fonts/font.css" />
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family: 'PeydaWebVF';
    }

    html, body {
        min-height: 100%;
        background: #000;
        overflow-x: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        color: #fff;
        font-size: 17px;
        letter-spacing: -0.4px;
        background: radial-gradient(ellipse at 50% -20%, #0A1F3D 0%, #050B18 45%, #000000 100%);
        background-attachment: fixed;
        min-height: 100vh;
        padding: 24px 20px;
    }

    .card {
        width: 100%;
        max-width: 500px;
        background: #1C1C1E;
        border-radius: 24px;
        padding: 26px 22px 22px;
        box-shadow:
            0 1px 0 rgba(255,255,255,0.04) inset,
            0 0 0 0.5px rgba(255,255,255,0.06),
            0 20px 60px rgba(0,0,0,0.5);
        animation: fadeIn 0.5s ease;
        position: relative;
        overflow: hidden;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .card::before {
        content: "";
        position: absolute;
        top: -60%;
        left: -20%;
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, rgba(10, 132, 255, 0.18) 0%, transparent 70%);
        pointer-events: none;
    }

    .card h1 {
        font-size: 22px;
        font-weight: 700;
        color: #FFFFFF;
        letter-spacing: -0.5px;
        line-height: 1.3;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        position: relative;
    }

    .card h1 span {
        font-family: 'PeydaWebVF';
        font-size: 12px;
        font-weight: 500;
        color: #64B5FF;
        background: rgba(10, 132, 255, 0.15);
        border: 0.5px solid rgba(10, 132, 255, 0.35);
        padding: 4px 10px;
        border-radius: 8px;
        letter-spacing: 0.3px;
        direction: ltr;
        margin-right: auto;
        white-space: nowrap;
    }

    .input-area {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        position: relative;
    }

    .input-area input {
        flex: 1;
        background: #2C2C2E;
        border: none;
        outline: none;
        color: #FFFFFF;
        font-size: 16px;
        font-family: 'PeydaWebVF';
        letter-spacing: -0.3px;
        padding: 14px 16px;
        border-radius: 14px;
        direction: rtl;
        transition: box-shadow 0.2s;
        min-width: 0;
        box-shadow: 0 0 0 0.5px rgba(255,255,255,0.06);
    }

    .input-area input::placeholder {
        color: #6E6E73;
    }

    .input-area input:focus {
        box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.7);
    }

    .input-area button {
        background: #0A84FF;
        border: none;
        color: #FFFFFF;
        font-family: 'PeydaWebVF';
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.3px;
        padding: 0 20px;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        box-shadow: 0 4px 14px rgba(10, 132, 255, 0.35);
        -webkit-tap-highlight-color: transparent;
        flex-shrink: 0;
    }

    .input-area button:active {
        background: #0060CC;
        transform: scale(0.97);
        box-shadow: 0 2px 8px rgba(10, 132, 255, 0.5);
    }

    .input-area button:disabled {
        background: #2C2C2E;
        color: #6E6E73;
        cursor: not-allowed;
        box-shadow: none;
    }

    .output-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding: 0 4px;
        font-size: 13px;
        color: #8E8E93;
        letter-spacing: -0.1px;
    }

    .output-header span:first-child {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 12px;
    }

    .result-box {
        position: relative;
        margin-bottom: 16px;
    }

    .result-box textarea {
        width: 100%;
        min-height: 260px;
        background: #0A0A0B;
        border: 0.5px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        color: #E0E0E5;
        font-family: 'PeydaWebVF';
        font-size: 13px;
        line-height: 1.7;
        padding: 16px;
        resize: vertical;
        outline: none;
        direction: ltr;
        text-align: left;
        letter-spacing: 0;
        transition: box-shadow 0.2s, border-color 0.2s;
        -webkit-user-select: text;
        user-select: text;
    }

    .result-box textarea::placeholder {
        color: #48484A;
        font-family: 'PeydaWebVF';
        text-align: center;
        padding-top: 100px;
        font-size: 14px;
    }

    .result-box textarea:focus {
        border-color: rgba(10, 132, 255, 0.6);
        box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
    }

    .result-box textarea::-webkit-scrollbar {
        width: 6px;
    }
    .result-box textarea::-webkit-scrollbar-track {
        background: transparent;
    }
    .result-box textarea::-webkit-scrollbar-thumb {
        background: #3A3A3C;
        border-radius: 3px;
    }
    .result-box textarea::-webkit-scrollbar-thumb:hover {
        background: #48484A;
    }

    .action-buttons {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    .status-msg {
        flex: 1;
        font-size: 13px;
        color: #8E8E93;
        letter-spacing: -0.1px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        background: #2C2C2E;
        border-radius: 12px;
        transition: all 0.25s;
        min-height: 40px;
        line-height: 1.4;
    }

    .status-msg::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #8E8E93;
        flex-shrink: 0;
        transition: background 0.25s;
    }

    .status-msg.success {
        color: #30D158;
        background: rgba(48, 209, 88, 0.12);
    }
    .status-msg.success::before {
        background: #30D158;
        box-shadow: 0 0 8px rgba(48, 209, 88, 0.6);
    }

    .status-msg.error {
        color: #FF453A;
        background: rgba(255, 69, 58, 0.12);
    }
    .status-msg.error::before {
        background: #FF453A;
        box-shadow: 0 0 8px rgba(255, 69, 58, 0.6);
    }

    .status-msg.loading {
        color: #64B5FF;
        background: rgba(10, 132, 255, 0.12);
    }
    .status-msg.loading::before {
        background: #64B5FF;
        box-shadow: 0 0 8px rgba(100, 181, 255, 0.6);
        animation: blink 1s ease-in-out infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    .copy-btn {
        background: #2C2C2E;
        border: none;
        color: #FFFFFF;
        font-family: 'PeydaWebVF';
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.2px;
        padding: 10px 30px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 0 0 0.5px rgba(255,255,255,0.06);
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
        flex-shrink: 0;
    }

    .copy-btn:active {
        background: #3A3A3C;
        transform: scale(0.96);
    }

    .copy-btn.copied {
        background: rgba(48, 209, 88, 0.2);
        color: #30D158;
        box-shadow: 0 0 0 0.5px rgba(48, 209, 88, 0.4);
    }

    .footnote {
        text-align: center;
        font-size: 12px;
        color: #48484A;
        letter-spacing: -0.1px;
        line-height: 1.6;
        padding-top: 16px;
        border-top: 0.5px solid #2C2C2E;
    }

    .footnote code {
        font-family: 'PeydaWebVF';
        font-size: 11px;
        color: #64B5FF;
        background: rgba(10, 132, 255, 0.12);
        padding: 2px 6px;
        border-radius: 5px;
        direction: ltr;
        display: inline-block;
        margin: 0 2px;
    }

    .toast {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: rgba(28, 28, 30, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        color: #FFFFFF;
        padding: 12px 20px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,255,255,0.1);
        z-index: 1000;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        letter-spacing: -0.2px;
        max-width: 90%;
    }

    .toast.show {
        transform: translateX(-50%) translateY(0);
    }

    .toast svg {
        width: 16px;
        height: 16px;
        stroke: #30D158;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
    }

    @media (max-width: 420px) {
        .card { padding: 22px 18px 18px; border-radius: 20px; }
        .card h1 { font-size: 20px; }
        .card h1 span { font-size: 11px; padding: 3px 8px; }
        .input-area input { font-size: 15px; padding: 13px 14px; }
        .input-area button { padding: 0 16px; font-size: 14px; }
        .result-box textarea { min-height: 220px; font-size: 12px; }
        .copy-btn { padding: 10px 14px; font-size: 13px; }
        .status-msg { font-size: 12px; padding: 9px 12px; }
    }
</style>
</head>
<body>

<div class="card">
    <h1>
        پروفایل هوشمند
    </h1>

    <div class="input-area">
        <input type="text" id="codeInput" placeholder="Code 900" value="900" autofocus>
        <button id="loadBtn">جستجو</button>
    </div>



    <div class="result-box">
        <textarea id="outputArea" readonly placeholder="اینجا نتیجه نمایش داده می‌شود ..."></textarea>
    </div>

    <div class="action-buttons">
        <div id="statusMessage" class="status-msg">آماده</div>
        <button class="copy-btn" id="copyBtn">کپی متن</button>
        <button class="copy-btn" id="copyLink">کپی لینک</button>
    </div>
</div>

<script>
(function () {
    const codeInput = document.getElementById('codeInput');
    const loadBtn = document.getElementById('loadBtn');
    const outputArea = document.getElementById('outputArea');
    const copyBtn = document.getElementById('copyBtn');
    const copyLink = document.getElementById('copyLink');
    const statusMsg = document.getElementById('statusMessage');

    let tmeLink = '';

    function setStatus(text, type = '') {
        statusMsg.textContent = text;
        statusMsg.className = 'status-msg ' + (type || '');
    }

    function formatNumber(num) {
        if (num === undefined || num === null || isNaN(num)) return '0';
        return Number(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function buildOutputText(data, code) {
        const profile = data.profile || {};
        const locations = data.locations || [];
        const bookingTypes = data.bookingTypes || [];
        const extras = data.extras || [];

        const name         = profile.name || 'بدون نام';
        const type         = profile.type || 'معمولی';
        const age          = profile.age ?? '?';
        const height       = profile.height ?? '?';
        const weight       = profile.weight ?? '?';
        const bodyType     = profile.bodyType || '?';
        const bust         = profile.bust ?? '?';
        const hips         = profile.hips || '?';
        const description  = profile.description || '';

        tmeLink = `https://t.me/AsalReserveBot/code${code}`;

        let locationStr = '';
        const hostLoc = locations.find(l => l.id === 'Hostly');
        const outLoc  = locations.find(l => l.id === 'Outly');

        if (hostLoc && hostLoc.address) {
            locationStr = hostLoc.address;
        }
        if (outLoc) {
            if (locationStr) locationStr += ' + اعزامی';
            else locationStr = 'اعزامی';
        }
        if (!locationStr) locationStr = 'نامشخص';

        const hourly  = bookingTypes.find(b => b.id === 'Hourly');
        const nightly = bookingTypes.find(b => b.id === 'Nightly');

        let priceLines = [];

        if (hourly && Array.isArray(hourly.options)) {
            hourly.options.forEach(opt => {
                const label = opt.sub || opt.label || 'گزینه';
                const price = opt.price;
                if (price !== undefined && price !== null) {
                    priceLines.push(`▪️ ${label}     | ${formatNumber(price)} تومان`);
                }
            });
        }

        if (nightly && Array.isArray(nightly.options)) {
            nightly.options.forEach(opt => {
                const label = opt.sub || opt.label || 'گزینه';
                const price = opt.price;
                if (price !== undefined && price !== null) {
                    priceLines.push(`▪️ ${label}     | ${formatNumber(price)} تومان`);
                }
            });
        }

        if (priceLines.length === 0) {
            priceLines.push('▪️ قیمتی ثبت نشده است');
        }

        let extrasList = [];
        if (Array.isArray(extras) && extras.length > 0) {
            extras.forEach(ex => {
                const label = ex.label || ex.sub || 'آیتم';
                extrasList.push(`🔸 ${label}`);
            });
        } else {
            extrasList.push('🔸 موردی ثبت نشده است');
        }

        const lines = [];
        lines.push(`💟 ${name} (${type})  | کد  ${code}`);
        lines.push('');
        lines.push(`🎂 سن: ${age}`);
        lines.push(`💎 قد: ${height} |  وزن: ${weight} |  اندام: ${bodyType}`);
        lines.push(`💎 سایز سینه:  ${bust} |  باسن: ${hips}`);
        lines.push('');
        lines.push(`📍 محدوده: ${locationStr}`);
        lines.push(`📝 ${description}`);
        lines.push('');
        lines.push('——————');
        lines.push('💰 لیست قیمت:');
        priceLines.forEach(l => lines.push(l));
        lines.push('——————');
        lines.push('➕موارد اضافی:');
        extrasList.forEach(l => lines.push(l));
        lines.push('——————');
        lines.push('');
        lines.push('🔞 برای دیدن عکس اندام پیام بدید: @AsalSop');
        lines.push('');
        lines.push('👑 Asal Reserve Group');

        return lines.join('\n');
    }

    async function loadProfileByCode(code) {
        const cleanCode = String(code).trim().replace(/[^a-zA-Z0-9_-]/g, '');
        if (!cleanCode) throw new Error('کد وارد شده معتبر نیست');

        const filePath = `data/${cleanCode}.json`;

        const response = await fetch(filePath, { cache: 'no-store' });
        if (!response.ok) {
            throw new Error(`کد ${cleanCode} پیدا نشد (${response.status})`);
        }

        const data = await response.json();
        return { data, usedCode: cleanCode };
    }

    async function updateProfile() {
        const rawCode = codeInput.value.trim();
        if (!rawCode) {
            setStatus('لطفاً یک کد وارد کنید', 'error');
            outputArea.value = '';
            return;
        }

        setStatus('در حال بارگذاری...', '');
        outputArea.value = '';

        try {
            const { data, usedCode } = await loadProfileByCode(rawCode);
            setStatus(`اطلاعات ${usedCode} بارگذاری شد`, 'success');
            outputArea.value = buildOutputText(data, usedCode);
        } catch (err) {
            console.error(err);
            setStatus(err.message || 'خطا در خواندن فایل', 'error');
            outputArea.value = '';
            tmeLink = ''; 
        }
    }

    async function copyToClipboard(text) {
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return true;
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            ta.style.pointerEvents = 'none';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
        } catch (e) {
            console.error('Copy failed:', e);
            return false;
        }
    }

    async function copyOutput() {
        const text = outputArea.value.trim();
        if (!text) {
            setStatus('متنی برای کپی وجود ندارد', 'error');
            return;
        }
        const ok = await copyToClipboard(text);
        if (ok) {
            setStatus('متن کپی شد!', 'success');
            setTimeout(() => {
                if (statusMsg.textContent.includes('کپی')) setStatus('آماده', '');
            }, 2000);
        } else {
            setStatus('خطا در کپی', 'error');
        }
    }

    async function copyOutLink() {
        if (!tmeLink) {
            setStatus('ابتدا یک پروفایل را بارگذاری کنید', 'error');
            return;
        }
        const ok = await copyToClipboard(tmeLink);
        if (ok) {
            setStatus('لینک کپی شد!', 'success');
            if (navigator.vibrate) navigator.vibrate(10);
            setTimeout(() => {
                if (statusMsg.textContent.includes('کپی')) setStatus('آماده', '');
            }, 2000);
        } else {
            setStatus('خطا در کپی', 'error');
        }
    }

    loadBtn.addEventListener('click', updateProfile);
    codeInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); updateProfile(); }
    });
    copyBtn.addEventListener('click', copyOutput);
    copyLink.addEventListener('click', copyOutLink);

    window.addEventListener('load', () => {
        setTimeout(() => { if (codeInput.value.trim() === '900') updateProfile(); }, 150);
    });
})();
</script>
</body>
</html>
