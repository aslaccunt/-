<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>به‌زودی</title>
<link rel="stylesheet" href="./fonts/font.css" />

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family: 'PeydaWebVF';
    }

    html, body {
        min-height: 100%;
        background: #000;
        overflow-x: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 17px;
        letter-spacing: -0.4px;
        background: radial-gradient(ellipse at 50% -20%, #0A1F3D 0%, #050B18 45%, #000000 100%);
        background-attachment: fixed;
        min-height: 100vh;
        padding: 24px;
    }

    .screen {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }


    .logo-wrap {
        position: relative;
        width: 92px;
        height: 92px;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-wrap::before {
        content: "";
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(10, 132, 255, 0.28) 0%, transparent 70%);
        animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 0.4; }
    }

    .logo-icon {
        position: relative;
        z-index: 2;
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: linear-gradient(135deg, #0A84FF 0%, #0060CC 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
            0 14px 36px rgba(10, 132, 255, 0.5),
            0 0 0 0.5px rgba(255, 255, 255, 0.15) inset;
    }

    .logo-icon svg {
        width: 40px;
        height: 40px;
        stroke: #FFFFFF;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .title {
        font-size: 30px;
        font-weight: 700;
        color: #FFFFFF;
        letter-spacing: -0.7px;
        line-height: 1.2;
        margin-bottom: 14px;
    }

    .title .accent {
        background: linear-gradient(135deg, #0A84FF 0%, #64B5FF 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        font-size: 15px;
        color: #8E8E93;
        letter-spacing: -0.2px;
        line-height: 1.7;
        max-width: 320px;
        margin-bottom: 36px;
    }

    .cta-button {
        width: 100%;
        padding: 18px;
        border-radius: 16px;
        border: none;
        background: #0A84FF;
        color: #FFFFFF;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.4px;
        cursor: pointer;
        font-family: 'PeydaWebVF';
        transition: all 0.2s ease;
        box-shadow: 0 8px 24px rgba(10, 132, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        -webkit-tap-highlight-color: transparent;
    }

    .cta-button:active {
        background: #0060CC;
        transform: scale(0.98);
        box-shadow: 0 4px 12px rgba(10, 132, 255, 0.5);
    }

    .cta-button svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
    }


    .footer-text {
        margin-top: 28px;
        font-size: 13px;
        color: #48484A;
        letter-spacing: -0.1px;
        line-height: 1.6;
    }
    
    .nav-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px 16px;
        position: sticky;
        top: 0;
        z-index: 20;

    }

    .nav-btn {
        background: none;
        border: none;
        color: #0A84FF;
        font-size: 17px;
        font-weight: 400;
        cursor: pointer;
        padding: 6px 0;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: 'PeydaWebVF';
    }
    .nav-btn:active { opacity: 0.5; }
    .nav-btn svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
    }
</style>
</head>
<body>

<div class="screen">

    <div class="logo-wrap">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
        </div>
    </div>

    <h1 class="title">
        <span class="accent">به‌زودی</span><br>
        لیست کیس‌ها
    </h1>

    <p class="subtitle">
        لیست کیس‌ها به‌زودی در این بخش قرار می‌گیرد.<br>
        فعلاً برای دیدن کیس‌ها روی دکمه‌ی زیر بزنید.
    </p>

    <button class="cta-button" id="channelBtnVIP" type="button">
        <svg viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        کانال VIP   
    </button>
    <br>
    <button class="cta-button" id="channelBtn" type="button">
        <svg viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        کانال معمولی  
    </button>
    
    <div class="nav-bar">
        <button class="nav-btn" type="button" onclick="history.back()">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            بازگشت
        </button>
    </div>
</div>

<script>
(function () {
    const CHANNEL_URL = 'https://t.me/asaalbanou';
    const channelBtn = document.getElementById('channelBtn');
    channelBtn.addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(10);
        window.open(CHANNEL_URL, '_blank');
    });
    const CHANNEL_VIP = 'https://t.me/asalbanouVIP';
    const channelBtnVIP = document.getElementById('channelBtnVIP');
    channelBtnVIP.addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(10);
        window.open(CHANNEL_VIP, '_blank');
    });
})();
</script>

</body>
</html>
