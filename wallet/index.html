<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050B18">
    <title>پرداخت · شارژ کیف پول</title>
    <link rel="stylesheet" href="../fonts/font.css" />
    <link rel="stylesheet" href="../root.css" />
    <link rel="stylesheet" href="./wallet/style.css" />
</head>
<body>

<div class="screen">

    <div class="nav-bar">
        <button class="nav-btn" type="button" onclick="history.back()">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            بازگشت
        </button>
    </div>

    <div class="page-header">
        <h1 class="large-title">موجودی کافی نیست</h1>
        <p class="subtitle">برای تکمیل رزرو، کیف پول خود را شارژ کنید.</p>
    </div>

    <div class="amount-card">
        <div class="amount-label">
            <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            مبلغ پیش پرداخت
        </div>
        <div class="amount-value">
            <span class="amount-currency">تومان</span>
            <span id="price">0</span>
        </div>

        <div class="amount-divider"></div>

        <div class="compare-row">
            <span class="compare-label">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                موجودی فعلی
            </span>
            <span class="compare-value negative" id="balanceValue">۰ تومان</span>
        </div>
    </div>

    <div class="guide-card">
        <div class="guide-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </div>
        <div class="guide-content">
            <div class="guide-title">چطور شارژ کنم؟</div>
            <div class="guide-text">
                برای شارژ کیف پول، روی دکمه‌ی زیر بزنید و درخواست را ارسال کنید. کمتر از ۵ دقیقه، موجودی شما به‌روزرسانی می‌شود.
            </div>
        </div>
    </div>

    <button class="cta-button" id="messageBtn" type="button">
        شارژ کیف پول
    </button>

    <div class="admin-card">
        <div class="admin-header">
            <div class="admin-avatar">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="admin-info">
                <div class="admin-name">ادمین پشتیبانی</div>
                <div class="admin-id" id="adminId">@AsalSup</div>
            </div>
        </div>

        <div class="admin-action" id="copyBtn">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="admin-action-text">کپی آیدی ادمین</span>
        </div>
    </div>

</div>

<div class="toast" id="toast">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toastText">انجام شد</span>
</div>

<script>
(function () {
    'use strict';
    const toast         = document.getElementById('toast');
    const toastText     = document.getElementById('toastText');
    const copyBtn       = document.getElementById('copyBtn');
    const messageBtn    = document.getElementById('messageBtn');
    const adminIdEl     = document.getElementById('adminId');
    const priceEl       = document.getElementById('price');
    const balanceEl     = document.getElementById('balanceValue');
    const ADMIN_USERNAME = 'AsalSup';
    const ADMIN_ID       = '@' + ADMIN_USERNAME;
    const params = new URLSearchParams(window.location.search);
    const booking = {
        code:       params.get('code')       || '—',
        total:      Number(params.get('total'))      || 0,
        prepayment: Number(params.get('prepayment')) || 0,
        remaining:  Number(params.get('remaining'))  || 0,
        balance:    Number(params.get('balance'))    || 0,
        userId:     params.get('userId')    || '—',
        therapist:  params.get('therapist') || '—',
        service:    params.get('service')   || '—',
        date:       params.get('date')      || '—'
    };

    function formatFa(n) {
        return Number(n).toLocaleString('fa-IR');
    }

    priceEl.textContent   = formatFa(booking.prepayment);
    balanceEl.textContent = formatFa(booking.balance) + ' تومان';

    let toastTimer = null;
    function showToast(text, isError = false) {
        toastText.textContent = text;
        toast.querySelector('svg').style.stroke = isError ? '#FF453A' : '#30D158';
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function copyToClipboard(text) {
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return true;
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
        } catch (e) {
            return false;
        }
    }

    copyBtn.addEventListener('click', async () => {
        const ok = await copyToClipboard(ADMIN_ID);
        if (ok) {
            const originalHTML = copyBtn.innerHTML;
            copyBtn.style.background = 'rgba(48, 209, 88, 0.15)';
            copyBtn.innerHTML = `
                <svg viewBox="0 0 24 24" style="stroke:#30D158"><polyline points="20 6 9 17 4 12"/></svg>
                <span class="admin-action-text" style="color:#30D158">کپی شد!</span>
            `;
            showToast('آیدی ادمین کپی شد');
            if (navigator.vibrate) navigator.vibrate(10);
            setTimeout(() => {
                copyBtn.innerHTML = originalHTML;
                copyBtn.style.background = '';
            }, 2200);
        } else {
            showToast('کپی ناموفق بود', true);
        }
    });

    adminIdEl.addEventListener('click', async () => {
        const ok = await copyToClipboard(ADMIN_ID);
        if (ok) {
            showToast('آیدی ادمین کپی شد');
            if (navigator.vibrate) navigator.vibrate(8);
        }
    });


    function buildMessage() {
        let qr = Math.floor(10000 + Math.random() * 90000);
        const lines = [
            `#${qr} - درخواست شارژ کیف پول`,
            '---',
            `🎖 کد : ${booking.code}`,
            `💳 مبلغ شارژ: ${formatFa(booking.prepayment)} تومان`
        ];

        if (booking.therapist !== '—') lines.push(`ماساژور: ${booking.therapist}`);
        if (booking.service   !== '—') lines.push(`خدمت: ${booking.service}`);
        if (booking.date      !== '—') lines.push(`تاریخ: ${booking.date}`);

        return lines.join('\n');
    }


    function openTelegramWithText() {
        const text   = encodeURIComponent(buildMessage());
        const webUrl = `https://t.me/${ADMIN_USERNAME}?text=${text}`;
        const tgUrl  = `tg://resolve?domain=${ADMIN_USERNAME}&text=${text}`;

        const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

        if (isMobile) {
            const start = Date.now();
            window.location.href = tgUrl;
            setTimeout(() => {
                if (Date.now() - start < 1500 && !document.hidden) {
                    window.location.href = webUrl;
                }
            }, 800);
        } else {
            window.open(webUrl, '_blank');
        }
    }

    messageBtn.addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(10);
        openTelegramWithText();
        showToast('تلگرام باز شد · پیام را ارسال کنید');
    });

})();
</script>

</body>
</html>
